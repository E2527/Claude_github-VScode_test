name: build

on:
  push:
  pull_request:

jobs:
  3ds:
    runs-on: ubuntu-latest
    # イメージは 3ds/build.sh と .devcontainer/devcontainer.json と揃えること
    container: devkitpro/devkitarm@sha256:116afba8df8453961de2936ffab20dd441edf4d682856c1ec8b0e53d7ed0bbf5
    steps:
      - uses: actions/checkout@v4
      - name: Build 3DS app
        run: make -C 3ds
      - uses: actions/upload-artifact@v4
        with:
          name: robot-controller-3dsx
          path: 3ds/robot-controller.3dsx

  receiver:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Test receiver
        working-directory: receiver
        run: python -m unittest discover -s tests -v
