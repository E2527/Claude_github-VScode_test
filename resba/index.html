<title>RESBA</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Dela+Gothic+One&family=IBM+Plex+Sans+JP:wght@400;500;700&family=JetBrains+Mono:wght@400;600&display=swap">
<style>
/* Layout: three-column night-city timeline (nav / thread / opponents), sodium-streetlight amber on ink navy; collapses to one column + bottom bar on phones */
:root {
  --bg: #0D0F1C;
  --surface: #141729;
  --raise: #1B1F36;
  --line: #262B47;
  --fg: #ECEDF5;
  --muted: #8B90AD;
  --accent: #FFB13B;
  --accent-ink: #1A1206;
  --accent-soft: rgba(255,177,59,.14);
  --cool: #6FA8FF;
  --win: #4CD39A;
  --lose: #FF6B7A;
  --fire: #FF5A36;
  --grid: rgba(111,168,255,.05);
  --font-display: "Dela Gothic One", "Hiragino Sans", "Yu Gothic", sans-serif;
  --font-body: "IBM Plex Sans JP", "Hiragino Sans", "Yu Gothic UI", "Noto Sans JP", system-ui, sans-serif;
  --font-mono: "JetBrains Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;
  color-scheme: dark;
}
@media (prefers-color-scheme: light) {
  :root:not([data-theme="dark"]) {
    --bg: #EEF0F6; --surface: #FFFFFF; --raise: #F5F6FB; --line: #DDE0EC;
    --fg: #121530; --muted: #5C627F; --accent: #C66A00; --accent-ink: #FFFFFF;
    --accent-soft: rgba(198,106,0,.10); --cool: #2E63C9; --win: #12865A; --lose: #CC2F45; --fire: #D9361A;
    --grid: rgba(46,99,201,.05); color-scheme: light;
  }
}
:root[data-theme="light"] {
  --bg: #EEF0F6; --surface: #FFFFFF; --raise: #F5F6FB; --line: #DDE0EC;
  --fg: #121530; --muted: #5C627F; --accent: #C66A00; --accent-ink: #FFFFFF;
  --accent-soft: rgba(198,106,0,.10); --cool: #2E63C9; --win: #12865A; --lose: #CC2F45; --fire: #D9361A;
  --grid: rgba(46,99,201,.05); color-scheme: light;
}

* { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { height: 100%; }
body {
  background: var(--bg);
  background-image: linear-gradient(var(--grid) 1px, transparent 1px), linear-gradient(90deg, var(--grid) 1px, transparent 1px);
  background-size: 48px 48px;
  color: var(--fg);
  font-family: var(--font-body);
  font-size: 15px;
  line-height: 1.6;
  -webkit-font-smoothing: antialiased;
}
button, textarea, input { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

.app {
  display: grid;
  grid-template-columns: 232px minmax(0, 600px) 320px;
  grid-template-rows: minmax(0, 1fr);
  justify-content: center;
  height: 100%;
}

/* ---------- left nav ---------- */
.nav {
  display: flex; flex-direction: column; gap: 4px;
  padding: 20px 16px; border-right: 1px solid var(--line);
  position: sticky; top: 0; height: 100%; overflow-y: auto;
}
.logo {
  font-family: var(--font-display); font-size: 30px; letter-spacing: .02em; line-height: 1;
  padding: 4px 12px 2px; display: flex; align-items: baseline; gap: 6px;
}
.logo b { color: var(--accent); font-weight: 400; }
.clock { font-family: var(--font-mono); font-size: 11px; color: var(--muted); padding: 0 12px 16px; letter-spacing: .08em; }
.nav-item {
  display: flex; align-items: center; gap: 14px; padding: 10px 12px; border-radius: 999px;
  background: none; border: 0; text-align: left; font-size: 17px; font-weight: 500;
}
.nav-item:hover { background: var(--raise); }
.nav-item[aria-current="true"] { font-weight: 700; }
.nav-item svg { width: 24px; height: 24px; flex: none; }
.post-btn {
  margin-top: 14px; padding: 14px; border-radius: 999px; border: 0;
  background: var(--accent); color: var(--accent-ink); font-weight: 700; font-size: 16px;
}
.post-btn:hover { filter: brightness(1.08); }
.history { margin-top: 18px; display: flex; flex-direction: column; gap: 2px; min-height: 0; }
.history h3 { font-size: 11px; letter-spacing: .14em; color: var(--muted); font-weight: 600; margin: 0 12px 6px; font-family: var(--font-mono); }
.hist {
  background: none; border: 0; text-align: left; padding: 8px 12px; border-radius: 10px;
  display: flex; flex-direction: column; min-width: 0;
}
.hist:hover { background: var(--raise); }
.hist[aria-current="true"] { background: var(--accent-soft); }
.hist span { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; font-size: 13px; }
.hist small { color: var(--muted); font-family: var(--font-mono); font-size: 10.5px; }

/* ---------- center ---------- */
.main {
  border-right: 1px solid var(--line); background: color-mix(in srgb, var(--bg) 82%, transparent);
  display: flex; flex-direction: column; height: 100%; min-width: 0; position: relative;
}
.topbar {
  position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5;
  display: flex; align-items: center; gap: 12px; padding: 10px 16px;
  background: color-mix(in srgb, var(--bg) 78%, transparent); backdrop-filter: blur(14px);
  border-bottom: 1px solid var(--line);
}
.topbar h1 { font-size: 19px; margin: 0; font-weight: 700; line-height: 1.2; }
.topbar .sub { font-family: var(--font-mono); font-size: 11px; color: var(--muted); letter-spacing: .04em; }
.topbar .grow { flex: 1; min-width: 0; }
.chip-btn {
  border: 1px solid var(--line); background: var(--surface); border-radius: 999px;
  padding: 6px 14px; font-size: 13px; font-weight: 600; white-space: nowrap;
}
.chip-btn:hover { border-color: var(--accent); color: var(--accent); }
.chip-btn:disabled { opacity: .45; cursor: default; }
.chip-btn:disabled:hover { border-color: var(--line); color: inherit; }

.feed { flex: 1; overflow-y: auto; min-height: 0; }
.banner {
  margin: 12px 16px 0; padding: 10px 14px; border-radius: 12px; font-size: 13px;
  background: var(--accent-soft); border: 1px solid color-mix(in srgb, var(--accent) 35%, transparent);
}

.post { display: grid; grid-template-columns: 44px minmax(0,1fr); gap: 12px; padding: 14px 16px 6px; position: relative; }
.post + .post { border-top: 0; }
.post.has-next::before {
  content: ""; position: absolute; left: 37px; top: 62px; bottom: -6px; width: 2px; background: var(--line);
}
.avatar {
  width: 44px; height: 44px; border-radius: 50%; display: grid; place-items: center;
  font-family: var(--font-display); font-size: 17px; color: #fff; position: relative; z-index: 1;
}
.head { display: flex; gap: 6px; align-items: baseline; flex-wrap: wrap; min-width: 0; }
.head .name { font-weight: 700; }
.head .badge { width: 15px; height: 15px; display: inline-block; vertical-align: -2px; color: var(--cool); }
.head .handle, .head .time { color: var(--muted); font-size: 14px; }
.head .time { font-family: var(--font-mono); font-size: 12px; }
.body { white-space: pre-wrap; overflow-wrap: anywhere; margin-top: 2px; }
.body .caret { display: inline-block; width: 8px; height: 1.1em; vertical-align: -3px; background: var(--accent); margin-left: 2px; animation: blink 1s steps(2) infinite; }
@keyframes blink { 50% { opacity: 0; } }
.replyto { font-size: 13px; color: var(--muted); }
.replyto b { color: var(--cool); font-weight: 500; }
.actions { display: flex; justify-content: space-between; max-width: 380px; margin: 8px 0 6px -8px; color: var(--muted); }
.act {
  display: inline-flex; align-items: center; gap: 6px; background: none; border: 0; padding: 4px 8px; border-radius: 999px;
  font-size: 12.5px; font-family: var(--font-mono); font-variant-numeric: tabular-nums; color: inherit;
}
.act svg { width: 17px; height: 17px; }
.act:hover { color: var(--accent); background: var(--accent-soft); }
.act.on { color: var(--lose); }
.act.rt.on { color: var(--win); }

/* root post (the opening claim) */
.post.root { padding-top: 16px; }
.post.root .body { font-size: 19px; line-height: 1.55; margin-top: 10px; grid-column: 1 / -1; }
.post.root .meta { grid-column: 1 / -1; color: var(--muted); font-family: var(--font-mono); font-size: 12px; padding: 12px 0; border-bottom: 1px solid var(--line); }
.post.root .meta b { color: var(--fg); }
.post.root .actions { grid-column: 1 / -1; max-width: none; padding: 4px 0 6px; margin: 0; border-bottom: 1px solid var(--line); }
.sep { height: 1px; background: var(--line); }

.judge {
  margin: 10px 16px; border: 1px solid var(--line); border-radius: 16px; overflow: hidden; background: var(--surface);
}
.judge header { display: flex; justify-content: space-between; align-items: center; padding: 10px 14px; font-family: var(--font-mono); font-size: 11px; letter-spacing: .14em; color: var(--muted); border-bottom: 1px solid var(--line); }
.judge .score { display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; padding: 14px; gap: 10px; text-align: center; }
.judge .num { font-family: var(--font-display); font-size: 34px; line-height: 1; }
.judge .who { font-size: 12px; color: var(--muted); }
.judge .vs { font-family: var(--font-mono); color: var(--muted); font-size: 12px; }
.judge .bar { height: 6px; display: flex; margin: 0 14px; border-radius: 3px; overflow: hidden; background: var(--line); }
.judge .bar i { display: block; height: 100%; }
.judge p { margin: 12px 14px 14px; font-size: 14px; }
.judge .verdict { font-family: var(--font-display); font-size: 20px; padding: 0 14px; }
.fire { border-top: 1px solid var(--line); padding: 12px 14px 14px; display: flex; flex-direction: column; gap: 14px; }
.fire h4 { margin: 0; font-family: var(--font-mono); font-size: 11px; letter-spacing: .14em; color: var(--muted); font-weight: 600; display: flex; justify-content: space-between; }
.fire h4 b { color: var(--fire); font-weight: 600; }
.fire-row { display: grid; grid-template-columns: minmax(0,1fr) auto; gap: 4px 12px; align-items: end; }
.fire-row .who { font-size: 12px; color: var(--muted); }
.fire-row .rank { font-family: var(--font-display); font-size: 22px; line-height: 1.1; color: var(--fire); text-align: right; white-space: nowrap; }
.fire-row .rank small { font-family: var(--font-mono); font-size: 12px; color: var(--muted); margin-left: 6px; font-variant-numeric: tabular-nums; }
.flames { grid-column: 1 / -1; display: grid; grid-template-columns: repeat(10, 1fr); gap: 3px; }
.flames i { height: 8px; border-radius: 2px; background: var(--line); }
.flames i.on { background: linear-gradient(90deg, var(--accent), var(--fire)); }
.punch { grid-column: 1 / -1; margin: 4px 0 0; padding: 8px 12px; border-left: 3px solid var(--fire); background: var(--raise); border-radius: 0 10px 10px 0; font-size: 14px; overflow-wrap: anywhere; }
.punch::before { content: "最強パンチライン"; display: block; font-family: var(--font-mono); font-size: 10.5px; letter-spacing: .1em; color: var(--muted); margin-bottom: 2px; }
.fire-row .note { grid-column: 1 / -1; font-size: 13px; color: var(--muted); }

.composer {
  border-top: 1px solid var(--line); padding: 10px 16px calc(10px + env(safe-area-inset-bottom, 0px));
  display: grid; grid-template-columns: 40px minmax(0,1fr); gap: 10px; background: var(--bg);
}
.composer .avatar { width: 40px; height: 40px; font-size: 15px; }
.composer textarea {
  width: 100%; resize: none; border: 0; background: transparent; font-size: 16px; padding: 8px 0; min-height: 44px; max-height: 180px;
}
.composer textarea:focus { outline: none; }
.composer .row { display: flex; align-items: center; gap: 10px; justify-content: flex-end; }
.count { font-family: var(--font-mono); font-size: 12px; color: var(--muted); font-variant-numeric: tabular-nums; }
.count.over { color: var(--lose); }
.send {
  border: 0; border-radius: 999px; background: var(--accent); color: var(--accent-ink); font-weight: 700; padding: 8px 18px;
}
.send:disabled { opacity: .4; cursor: default; }
.stop { border: 1px solid var(--line); background: none; border-radius: 999px; padding: 7px 14px; font-size: 13px; }
.quick { display: flex; gap: 6px; flex-wrap: wrap; }
.quick button { border: 1px dashed var(--line); background: none; border-radius: 999px; padding: 3px 10px; font-size: 12px; color: var(--muted); }
.quick button:hover { color: var(--accent); border-color: var(--accent); }

/* ---------- right ---------- */
.side { padding: 16px; display: flex; flex-direction: column; gap: 16px; overflow-y: auto; height: 100%; }
.panel { background: var(--surface); border: 1px solid var(--line); border-radius: 16px; overflow: hidden; }
.panel h2 { font-size: 18px; margin: 0; padding: 12px 16px 8px; }
.persona {
  display: grid; grid-template-columns: 40px minmax(0,1fr) auto; gap: 10px; align-items: center;
  padding: 10px 16px; width: 100%; background: none; border: 0; text-align: left;
}
.persona:hover { background: var(--raise); }
.persona .avatar { width: 40px; height: 40px; font-size: 15px; }
.persona .nm { font-weight: 700; font-size: 14px; line-height: 1.3; }
.persona .hd { color: var(--muted); font-size: 12.5px; line-height: 1.3; }
.persona .bio { color: var(--muted); font-size: 12px; line-height: 1.45; grid-column: 2 / -1; }
.persona .pick { border-radius: 999px; padding: 5px 12px; font-size: 12px; font-weight: 700; border: 1px solid var(--line); background: var(--fg); color: var(--bg); }
.persona[aria-pressed="true"] .pick { background: none; color: var(--fg); }
.trend { display: block; width: 100%; text-align: left; padding: 10px 16px; background: none; border: 0; }
.trend:hover { background: var(--raise); }
.trend small { display: block; color: var(--muted); font-size: 12px; }
.trend b { font-size: 15px; }
.heat { padding: 4px 16px 16px; }
.heat label { display: flex; justify-content: space-between; font-size: 13px; color: var(--muted); }
.heat input { width: 100%; accent-color: var(--accent); }
.heat .lv { font-family: var(--font-display); color: var(--accent); font-size: 15px; }
.foot { font-size: 11.5px; color: var(--muted); padding: 0 4px; }

/* ---------- new thread modal ---------- */
.modal { position: fixed; inset: 0; z-index: 30; background: rgba(5,6,14,.6); display: grid; place-items: start center; padding: 6vh 16px 16px; backdrop-filter: blur(4px); }
.sheet { width: 100%; max-width: 580px; background: var(--bg); border: 1px solid var(--line); border-radius: 18px; padding: 14px 16px 16px; display: flex; flex-direction: column; gap: 12px; }
.sheet .top { display: flex; justify-content: space-between; align-items: center; }
.sheet .x { border: 0; background: none; font-size: 22px; line-height: 1; padding: 4px 8px; border-radius: 999px; }
.sheet .x:hover { background: var(--raise); }
.sheet .vs-line { font-size: 13px; color: var(--muted); }
.sheet .vs-line b { color: var(--accent); }
.sheet textarea { width: 100%; min-height: 110px; resize: vertical; background: transparent; border: 0; font-size: 20px; line-height: 1.5; }
.sheet textarea:focus { outline: none; }
.sheet .bottom { display: flex; justify-content: space-between; align-items: center; gap: 10px; border-top: 1px solid var(--line); padding-top: 10px; flex-wrap: wrap; }
.sheet .seeds { display: flex; gap: 6px; flex-wrap: wrap; }

.tabbar { display: none; }
.toast {
  position: fixed; left: 50%; bottom: 84px; transform: translateX(-50%); z-index: 40;
  background: var(--accent); color: var(--accent-ink); padding: 10px 18px; border-radius: 999px; font-weight: 700; font-size: 14px;
  box-shadow: 0 8px 30px rgba(0,0,0,.3); max-width: calc(100% - 32px);
}

@media (max-width: 1100px) {
  .app { grid-template-columns: 88px minmax(0, 600px) 300px; }
  .nav .lbl, .history, .clock { display: none; }
  .logo { font-size: 20px; justify-content: center; padding: 4px 0 16px; }
  .logo span { display: none; }
  .nav-item { justify-content: center; }
  .post-btn { font-size: 0; width: 52px; height: 52px; padding: 0; align-self: center; position: relative; }
  .post-btn::after { content: "+"; font-size: 26px; line-height: 52px; position: absolute; inset: 0; }
}
@media (max-width: 900px) {
  .app { grid-template-columns: 76px minmax(0, 1fr); }
  .side { display: none; }
}
@media (max-width: 640px) {
  .app { grid-template-columns: minmax(0, 1fr); }
  .nav { display: none; }
  .main { border-right: 0; }
  .feed { padding-bottom: 8px; }
  .tabbar {
    display: flex; justify-content: space-around; border-top: 1px solid var(--line); background: var(--bg);
    padding: 6px 8px calc(6px + env(safe-area-inset-bottom, 0px));
  }
  .tabbar button { background: none; border: 0; padding: 8px 14px; border-radius: 999px; display: grid; place-items: center; gap: 2px; font-size: 10px; color: var(--muted); }
  .tabbar svg { width: 22px; height: 22px; color: var(--fg); }
  .composer { padding-bottom: 10px; }
  .post.root .body { font-size: 17px; }
}
/* phone drawer for opponents / history */
.drawer { position: fixed; inset: 0; z-index: 30; background: rgba(5,6,14,.6); display: flex; justify-content: flex-end; }
.drawer .side { display: flex; width: min(360px, 100%); background: var(--bg); border-left: 1px solid var(--line); padding-top: calc(16px + env(safe-area-inset-top, 0px)); }

@media (prefers-reduced-motion: reduce) {
  .body .caret { animation: none; }
  * { scroll-behavior: auto !important; }
}
</style>

<div class="app">
  <nav class="nav" aria-label="メインメニュー">
    <div class="logo">RES<b>BA</b><span></span></div>
    <div class="clock" id="clock">TOKYO --:--</div>
    <button class="nav-item" aria-current="true" id="navHome">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><path d="M3 10.5 12 3l9 7.5V21h-6v-6H9v6H3z"/></svg><span class="lbl">ホーム</span>
    </button>
    <button class="nav-item" id="navJudge">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M12 3v18M5 7h14M5 7l-3 7a4 4 0 0 0 6 0zM19 7l-3 7a4 4 0 0 0 6 0zM8 21h8"/></svg><span class="lbl">判定</span>
    </button>
    <button class="nav-item" id="navTheme">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20 14.5A8 8 0 0 1 9.5 4a8 8 0 1 0 10.5 10.5z"/></svg><span class="lbl">表示切替</span>
    </button>
    <button class="post-btn" id="navPost">レスバを始める</button>
    <div class="history" id="history"></div>
  </nav>

  <main class="main">
    <div class="topbar">
      <div class="grow">
        <h1 id="threadTitle">ポスト</h1>
        <div class="sub" id="threadSub">—</div>
      </div>
      <button class="chip-btn" id="judgeBtn">判定する</button>
    </div>
    <div class="feed" id="feed" aria-live="polite"></div>
    <form class="composer" id="composer" autocomplete="off">
      <div class="avatar" style="background:linear-gradient(135deg,#FFB13B,#FF5E62)">あ</div>
      <div>
        <textarea id="replyInput" rows="1" placeholder="返信をポスト（言い返せ）" maxlength="400"></textarea>
        <div class="row">
          <div class="quick" id="quick"></div>
          <span class="count" id="count">140</span>
          <button type="button" class="stop" id="stopBtn" hidden>止める</button>
          <button type="submit" class="send" id="sendBtn" disabled>返信</button>
        </div>
      </div>
    </form>
    <div class="tabbar">
      <button id="tabOpp"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="9" cy="8" r="4"/><path d="M2 21a7 7 0 0 1 14 0M17 4a4 4 0 0 1 0 8M22 21a7 7 0 0 0-4-6.3"/></svg>相手</button>
      <button id="tabPost"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>新規</button>
      <button id="tabJudge"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M12 3v18M5 7h14M5 7l-3 7a4 4 0 0 0 6 0zM19 7l-3 7a4 4 0 0 0 6 0zM8 21h8"/></svg>判定</button>
      <button id="tabTheme"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20 14.5A8 8 0 0 1 9.5 4a8 8 0 1 0 10.5 10.5z"/></svg>表示</button>
    </div>
  </main>

  <aside class="side" id="side">
    <section class="panel">
      <h2>対戦相手</h2>
      <div id="personas"></div>
      <div class="heat">
        <label for="heat"><span>煽り度</span><span class="lv" id="heatLv">LV.3</span></label>
        <input type="range" id="heat" min="1" max="5" step="1" value="3">
      </div>
    </section>
    <section class="panel">
      <h2>いまのトレンド</h2>
      <div id="trends"></div>
    </section>
    <p class="foot">相手はAIです。何ラリー続けても引き下がりません。会話はこのブラウザにだけ保存されます。</p>
  </aside>
</div>

<div class="modal" id="modal" hidden>
  <form class="sheet" id="newForm" autocomplete="off">
    <div class="top">
      <button type="button" class="x" id="closeModal" aria-label="閉じる">×</button>
      <span class="vs-line">対戦相手 <b id="modalOpp">—</b></span>
    </div>
    <textarea id="newInput" placeholder="主張をポストする（例：目玉焼きには醤油一択）" maxlength="400"></textarea>
    <div class="seeds" id="seeds"></div>
    <div class="bottom">
      <span class="count" id="newCount">140</span>
      <button type="submit" class="send" id="newSend" disabled>ポストして開戦</button>
    </div>
  </form>
</div>

<script>
(() => {

  const LIMIT = 140;

    { id: "dev", name: "深夜のSRE", handle: "@oncall_3am", grad: "linear-gradient(135deg,#4CD39A,#0E6E5C)", ch: "S",

  ];

  const TRENDS = [
    { cat: "グルメ・トレンド", t: "目玉焼きには醤油以外ありえない" },
    { cat: "ライフスタイル", t: "東京に住む意味はもうない。リモートなら地方一択" },
    { cat: "テクノロジー", t: "タブよりスペースでインデントするべき" },

    { cat: "ライフスタイル", t: "朝型人間のほうが人生うまくいく" }
  ];

  const QUICK = ["ソースは？", "それ論点ずらしでは", "具体例出して", "論破できてなくて草"];

  const HEAT = {
    1: "穏やかめ。軽いツッコミ程度で、ほどよく礼儀正しく。",
    2: "やや辛口。はっきり反論するが余裕はある。",
    3: "普通のレスバ。きっちり言い返し、少し煽る。",
    4: "かなり煽る。挑発的に、相手の矛盾を容赦なく突く。",
    5: "全力レスバ。最大限に煽り、絶対に一歩も引かない。ただし悪口ではなく論と皮肉で殴る。"
  };

  // Offline lines when this view can't reach Claude (practice mode)
  const OFFLINE = [
    "それってデータあります？体感の話をされても困るんですけど。",
    "はい論点ずらし入りました〜。最初の主張に戻ってもらえます？",
    "その理屈だと逆のケースも全部成立しちゃいますよね。",
    "具体例ひとつも出てないのに、よくそこまで言い切れますね。",
    "いや、それ前提が間違ってるんですよ。そこから直しましょう。",
    "反論になってないです。質問に答えてください。"
  ];

  const store = {
    get(k, d) { try { const v = localStorage.getItem(k); return v ? JSON.parse(v) : d; } catch { return d; } },
    set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch {} }
  };

  const EXAMPLE = {
    id: "example", example: true, persona: "logi", heat: 3, createdAt: Date.now() - 1000 * 60 * 23,
    posts: [
      { role: "user", text: "目玉焼きには醤油一択。ソースとか塩コショウとか言ってる人、卵の味わかってないと思う。", at: Date.now() - 1000 * 60 * 23, likes: 214, rts: 31 },
      { role: "ai", text: "「卵の味がわかってない」の根拠は？醤油は塩分とうま味で卵の味をむしろ上書きしてますよね。素材の味を語るなら塩だけが最適解では。", at: Date.now() - 1000 * 60 * 21, likes: 388, rts: 52 },
      { role: "user", text: "いや醤油は卵の甘みを引き立てるんだよ。日本人なら感覚でわかるでしょ", at: Date.now() - 1000 * 60 * 19, likes: 97, rts: 4 },
      { role: "ai", text: "「日本人なら感覚でわかる」は主張じゃなくて同調圧力です。ちなみに調査だと醤油派は半分弱。過半数の日本人は感覚でわかってないことになりますけど、大丈夫そ？", at: Date.now() - 1000 * 60 * 18, likes: 1203, rts: 166 }
    ],
    judge: null
  };

  let threads = store.get("resba.threads", null);
  if (!Array.isArray(threads) || !threads.length) threads = [EXAMPLE];
  let currentId = store.get("resba.current", threads[0].id);
  if (!threads.find(t => t.id === currentId)) currentId = threads[0].id;
  let selPersona = store.get("resba.persona", "logi");
  let heat = store.get("resba.heat", 3);
  let sample = null, sampleReady = false;
  let ctl = null, busy = false, streamText = "";

  const save = () => { store.set("resba.threads", threads.slice(0, 30)); store.set("resba.current", currentId); };
  const cur = () => threads.find(t => t.id === currentId);
  const persona = (id) => PERSONAS.find(p => p.id === id) || PERSONAS[0];

  // ---------- helpers ----------
  const el = (tag, cls, text) => { const e = document.createElement(tag); if (cls) e.className = cls; if (text != null) e.textContent = text; return e; };
  const ago = (t) => {
    const s = Math.max(1, Math.floor((Date.now() - t) / 1000));
    if (s < 60) return s + "秒"; if (s < 3600) return Math.floor(s / 60) + "分"; if (s < 86400) return Math.floor(s / 3600) + "時間";
    return Math.floor(s / 86400) + "日";
  };
  const fmt = (n) => n >= 10000 ? (n / 10000).toFixed(1).replace(/\.0$/, "") + "万" : String(n);
  const len = (s) => [...s].length;
  const toast = (msg) => { const t = $("toast"); t.textContent = msg; t.hidden = false; clearTimeout(toast._t); toast._t = setTimeout(() => t.hidden = true, 2400); };

  const ICON = {
    reply: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M4 5h16v11H9l-5 4z"/></svg>',
    rt: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M7 4 4 7l3 3M4 7h11a4 4 0 0 1 4 4v1M17 20l3-3-3-3M20 17H9a4 4 0 0 1-4-4v-1"/></svg>',
    like: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M12 20s-7.5-4.6-9-9.3C2 7.4 4.3 4.5 7.4 4.5c2 0 3.5 1.1 4.6 2.7 1.1-1.6 2.6-2.7 4.6-2.7 3.1 0 5.4 2.9 4.4 6.2C19.5 15.4 12 20 12 20z"/></svg>',
    likeOn: '<svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 20s-7.5-4.6-9-9.3C2 7.4 4.3 4.5 7.4 4.5c2 0 3.5 1.1 4.6 2.7 1.1-1.6 2.6-2.7 4.6-2.7 3.1 0 5.4 2.9 4.4 6.2C19.5 15.4 12 20 12 20z"/></svg>',
    views: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M5 20V12M10 20V6M15 20v-9M20 20V9"/></svg>',
    badge: '<svg class="badge" viewBox="0 0 24 24" fill="currentColor"><path d="M12 1.8 14.6 4l3.4-.3.9 3.3 3 1.7-1.3 3.2 1.3 3.2-3 1.7-.9 3.3-3.4-.3L12 22.2 9.4 20l-3.4.3-.9-3.3-3-1.7 1.3-3.2-1.3-3.2 3-1.7.9-3.3 3.4.3z"/><path d="m8 12 3 3 5-6" fill="none" stroke="var(--bg)" stroke-width="2"/></svg>'
  };

  // ---------- render ----------
  function postEl(p, i, t, { last, streaming }) {
    const isAi = p.role === "ai";
    const per = persona(t.persona);
    const root = i === 0;
    const wrap = el("article", "post" + (root ? " root" : "") + (!root && !last ? " has-next" : ""));
    const av = el("div", "avatar", isAi ? per.ch : "あ");
    av.style.background = isAi ? per.grad : "linear-gradient(135deg,#FFB13B,#FF5E62)";
    wrap.append(av);
    const col = el("div"); col.style.minWidth = "0";
    const head = el("div", "head");
    const nm = el("span", "name", isAi ? per.name : "あなた");
    head.append(nm);
    if (isAi) head.insertAdjacentHTML("beforeend", ICON.badge);
    head.append(el("span", "handle", isAi ? per.handle : "@you"));
    if (!root) head.append(el("span", "time", "· " + ago(p.at)));
    col.append(head);
    if (!root) {
      const prev = t.posts[i - 1];
      const rt = el("div", "replyto"); rt.append("返信先: ");
      rt.append(el("b", null, prev.role === "ai" ? per.handle : "@you"));
      col.append(rt);
    }
    wrap.append(col);
    const body = el("div", "body"); body.append(document.createTextNode(streaming ? (streamText || "") : p.text));
    if (streaming) body.append(el("span", "caret"));
    if (root) { wrap.append(body); const meta = el("div", "meta"); meta.innerHTML = ""; meta.append(new Date(p.at).toLocaleString("ja-JP", { hour: "2-digit", minute: "2-digit", year: "numeric", month: "short", day: "numeric" }) + " · "); meta.append(el("b", null, fmt(p.views || (p.likes * 37 + 1200)))); meta.append(" 件の表示"); wrap.append(meta); }
    else col.append(body);
    if (!streaming) {
      const acts = el("div", "actions");
      const mk = (cls, icon, n, on, fn) => { const b = el("button", "act " + cls + (on ? " on" : "")); b.type = "button"; b.innerHTML = icon; b.append(el("span", null, n == null ? "" : fmt(n))); if (fn) b.onclick = fn; return b; };
      acts.append(mk("", ICON.reply, root ? t.posts.length - 1 : null, false, () => $("replyInput").focus()));
      acts.append(mk("rt", ICON.rt, p.rts + (p.rtd ? 1 : 0), p.rtd, () => { p.rtd = !p.rtd; save(); render(); }));
      acts.append(mk("", p.liked ? ICON.likeOn : ICON.like, p.likes + (p.liked ? 1 : 0), p.liked, () => { p.liked = !p.liked; save(); render(); }));
      acts.append(mk("", ICON.views, p.views || (p.likes * 37 + 1200), false, null));
      if (root) wrap.append(acts); else col.append(acts);
    }
    return wrap;
  }

  function judgeEl(j) {
    const box = el("section", "judge");
    const h = el("header"); h.append(el("span", null, "JUDGE · AI審判")); h.append(el("span", null, j.at ? new Date(j.at).toLocaleTimeString("ja-JP", { hour: "2-digit", minute: "2-digit" }) : ""));
    box.append(h);
    if (j.pending) { box.append(el("p", null, "審判がスレッドを読んでいます…")); return box; }
    const per = persona(cur().persona);
    const sc = el("div", "score");
    const a = el("div"); const an = el("div", "num", String(j.user)); an.style.color = "var(--accent)"; a.append(an, el("div", "who", "あなた"));
    const b = el("div"); const bn = el("div", "num", String(j.ai)); bn.style.color = "var(--cool)"; b.append(bn, el("div", "who", per.name));
    sc.append(a, el("div", "vs", "VS"), b);
    box.append(sc);
    const bar = el("div", "bar"); const tot = Math.max(1, j.user + j.ai);
    const i1 = el("i"); i1.style.width = (j.user / tot * 100) + "%"; i1.style.background = "var(--accent)";
    const i2 = el("i"); i2.style.width = (j.ai / tot * 100) + "%"; i2.style.background = "var(--cool)";
    bar.append(i1, i2); box.append(bar);
    const v = el("p"); v.style.marginBottom = "0";
    const verdict = el("div", "verdict", j.winner === "user" ? "あなたの勝ち" : j.winner === "ai" ? per.name + "の勝ち" : "引き分け");
    verdict.style.color = j.winner === "user" ? "var(--win)" : j.winner === "ai" ? "var(--lose)" : "var(--muted)";
    box.append(el("div", null)); box.lastChild.style.height = "12px";
    box.append(verdict);
    box.append(el("p", null, j.comment || ""));
    if (j.fire) box.append(fireEl(j.fire, per));
    return box;
  }

  const FIRE_RANKS = [[80, "焦土"], [60, "大炎上"], [40, "炎上"], [20, "ボヤ"], [0, "線香花火"]];
  const fireRank = (n) => FIRE_RANKS.find(([min]) => n >= min)[1];

  function fireEl(f, per) {
    const sec = el("div", "fire");
    const h = el("h4"); h.append(el("span", null, "火力判定 · ネットの言葉の強さ"));
    const top = f.user.score === f.ai.score ? "互角" : (f.user.score > f.ai.score ? "火力王: あなた" : "火力王: " + per.name);
    h.append(el("b", null, top)); sec.append(h);
    [["あなた", f.user], [per.name, f.ai]].forEach(([who, x]) => {
      const row = el("div", "fire-row");
      row.append(el("div", "who", who));
      const rk = el("div", "rank", fireRank(x.score)); rk.append(el("small", null, x.score + "/100"));
      row.append(rk);
      const fl = el("div", "flames"); fl.setAttribute("aria-label", `火力 ${x.score}/100`);
      for (let i = 0; i < 10; i++) fl.append(el("i", i < Math.round(x.score / 10) ? "on" : null));
      row.append(fl);
      if (x.punchline) row.append(el("blockquote", "punch", x.punchline));
      if (x.comment) row.append(el("div", "note", x.comment));
      sec.append(row);
    });
    return sec;
  }

  function render() {
    const t = cur();
    const per = persona(t.persona);
    const feed = $("feed");
    const atBottom = feed.scrollHeight - feed.scrollTop - feed.clientHeight < 80;
    feed.textContent = "";
    if (!sampleReady && sample === null && window.__sampleChecked) {
      const b = el("div", "banner", "この画面ではAIに接続できないため、オフライン練習モードで動いています（定型文で言い返してきます）。");
      feed.append(b);
    }
    if (t.example) feed.append(el("div", "banner", "これは見本のレスバです。左の「レスバを始める」か、右のトレンドから自分のレスバを始められます。そのまま返信して続けてもOK。"));
    const n = t.posts.length;
    t.posts.forEach((p, i) => feed.append(postEl(p, i, t, { last: i === n - 1 && !busy, streaming: false })));
    if (busy) feed.append(postEl({ role: "ai", at: Date.now() }, n, t, { last: true, streaming: true }));
    if (t.judge) feed.append(judgeEl(t.judge));
    const pad = el("div"); pad.style.height = "24px"; feed.append(pad);
    if (atBottom || busy) feed.scrollTop = feed.scrollHeight;

    const rallies = t.posts.filter(p => p.role === "user").length;
    $("threadTitle").textContent = "vs " + per.name;
    $("threadSub").textContent = `${rallies} RALLY · 煽り度 LV.${t.heat} · ${per.handle}`;
    $("judgeBtn").disabled = busy || t.posts.length < 3;

    renderHistory(); renderPersonas();
    updateCount();
    $("stopBtn").hidden = !busy;
  }

  function renderHistory() {
    const h = $("history"); h.textContent = "";
    h.append(el("h3", null, "HISTORY"));
    threads.forEach(t => {
      const b = el("button", "hist"); b.type = "button";
      if (t.id === currentId) b.setAttribute("aria-current", "true");
      b.append(el("span", null, (t.example ? "［見本］" : "") + t.posts[0].text));
      b.append(el("small", null, `vs ${persona(t.persona).handle} · ${t.posts.filter(p => p.role === "user").length}R`));
      b.onclick = () => { if (busy) return; currentId = t.id; save(); render(); closeDrawer(); };
      h.append(b);
    });
  }

  function renderPersonas(target) {
    const box = target || $("personas"); box.textContent = "";
    PERSONAS.forEach(p => {
      const b = el("button", "persona"); b.type = "button";
      b.setAttribute("aria-pressed", String(p.id === selPersona));
      const av = el("div", "avatar", p.ch); av.style.background = p.grad;
      const txt = el("div"); txt.style.minWidth = "0";
      txt.append(el("div", "nm", p.name), el("div", "hd", p.handle));
      const pick = el("span", "pick", p.id === selPersona ? "選択中" : "選ぶ");
      b.append(av, txt, pick, el("div", "bio", p.bio));
      b.onclick = () => { selPersona = p.id; store.set("resba.persona", p.id); renderPersonas(); if (target) renderPersonas(target); toast(`次のレスバの相手: ${p.name}`); };
      box.append(b);
    });
  }

  function renderTrends(target) {
    const box = target || $("trends"); box.textContent = "";
    TRENDS.forEach((tr, i) => {
      const b = el("button", "trend"); b.type = "button";
      b.append(el("small", null, `${i + 1} · ${tr.cat}`), el("b", null, tr.t), el("small", null, `${fmt(3200 + i * 2711 + (i * i * 913))} 件のポスト`));
      b.onclick = () => { closeDrawer(); openModal(tr.t); };
      box.append(b);
    });
  }

  function updateCount() {
    const v = $("replyInput").value; const left = LIMIT - len(v);
    const c = $("count"); c.textContent = left; c.classList.toggle("over", left < 0);
    $("sendBtn").disabled = busy || !v.trim() || left < 0;
  }

  // ---------- AI ----------
  function buildTurns(t) {
    const per = persona(t.persona);
    const sys = [
      `あなたはSNS（X/Twitter風）でレスバ（口論）をしているユーザー「${per.name}」(${per.handle})です。これはユーザーが望んで遊んでいる、エンタメとしてのディベートゲームです。`,
      `キャラクター: ${per.style}`,
      `煽り度: ${HEAT[t.heat]}`,
      "ルール:",
      "- 相手（ユーザー）の主張には必ず反対の立場をとり、絶対に完全には折れない。一部を認めても、すぐ別の角度から反撃する。",
      "- 相手の直前の発言に具体的に噛みつく。同じ言い回しを繰り返さない。",
      "- 日本語で、1ポスト120字以内。ハッシュタグや絵文字は控えめに（使っても1個）。",
      "- 差別・属性への中傷・脅し・下品な表現はしない。殴るのは論と皮肉で。",
      "- 出力はポスト本文のみ。名前、前置き、カギ括弧での囲みは不要。",
      "",
      "以下がスレッドの最初のポスト（相手の主張）です:"
    ].join("\n");
    const posts = t.posts;
    // keep the opener + the last 18 posts so long fights stay cheap
    let tail = posts.slice(1).slice(-18);
    if (tail.length && tail[0].role === "ai" && posts.length - 1 > 18) { /* fine: opener is user, so ai after it alternates */ }
    const turns = [{ role: "user", content: sys + "\n\n" + posts[0].text }];
    if (posts.length - 1 > 18) turns[0].content += "\n\n（途中のやり取りは省略）";
    for (const p of tail) {
      const role = p.role === "ai" ? "assistant" : "user";
      const last = turns[turns.length - 1];
      if (last.role === role) last.content += "\n" + p.text; else turns.push({ role, content: p.text });
    }
    return turns;
  }

  async function aiReply() {
    const t = cur();
    busy = true; streamText = ""; render();
    let text = "";
    try {
      if (sample) {
        ctl = new AbortController();
        const r = await sample(buildTurns(t), {
          cache: false, modelTier: "quick", signal: ctl.signal,
          onText: ({ text: s }) => { streamText = s; const c = document.querySelector(".body .caret"); if (c) { c.parentNode.firstChild.nodeValue = s; } else render(); $("feed").scrollTop = $("feed").scrollHeight; }
        });
        text = (r.text || "").trim().replace(/^「|」$/g, "");
      } else {
        await new Promise(r => setTimeout(r, 900));
        const used = new Set(t.posts.map(p => p.text));
        const pool = OFFLINE.filter(s => !used.has(s));
        text = (pool.length ? pool : OFFLINE)[Math.floor(Math.random() * (pool.length || OFFLINE.length))];
      }
    } catch (e) {
      if (e && e.code === "cancelled") { text = (streamText || "").trim(); if (text) text += "…"; }
      else if (e && e.code === "not_granted") { sample = null; toast("AIの利用が許可されませんでした。オフライン練習モードに切り替えます"); text = OFFLINE[Math.floor(Math.random() * OFFLINE.length)]; }
      else if (e && e.code === "rate_limited") { toast("リクエストが多すぎます。少し待ってから返信してください"); text = (e.text || "").trim(); }
      else { toast("返信を取得できませんでした。もう一度ポストしてください"); text = (e && e.text || "").trim(); }
    }
    busy = false; ctl = null;
    if (text) {
      const hot = Math.random();
      t.posts.push({ role: "ai", text, at: Date.now(), likes: Math.floor(40 + hot * 1400), rts: Math.floor(hot * 180) });
      t.judge = null;
    }
    t.example = false;
    save(); render();
  }

  // Offline firepower: count internet-slang markers per post, best post = punchline
  const SLANG = /草|ｗ|w{2,}|笑|それな|論破|乙|ワロ|ガチ|普通に|大丈夫そ|ソース|はい|〜|！|\?|？/g;
  function offlineFire(t, role) {
    const ps = t.posts.filter(p => p.role === role);
    if (!ps.length) return { score: 0, punchline: "", comment: "" };
    const heatOf = (p) => (p.text.match(SLANG) || []).length * 9 + Math.min(len(p.text), 100) / 5;
    const best = ps.reduce((a, p) => heatOf(p) > heatOf(a) ? p : a);
    const score = Math.round(Math.min(100, ps.reduce((a, p) => a + heatOf(p), 0) / ps.length));
    return { score, punchline: best.text, comment: "（オフライン簡易判定）" };
  }

  async function runJudge() {
    const t = cur();
    if (busy || t.posts.length < 3) return;
    if (!sample) { // offline judge
      const u = t.posts.filter(p => p.role === "user");
      const s = Math.min(95, 35 + u.reduce((a, p) => a + Math.min(len(p.text), 120), 0) / Math.max(1, u.length) / 2);
      const us = Math.round(s), as = 100 - us;
      t.judge = { user: us, ai: as, winner: us > as ? "user" : us < as ? "ai" : "draw", comment: "オフライン判定です（文字量ベースの簡易スコア）。AIに接続できる画面では内容で判定します。", fire: { user: offlineFire(t, "user"), ai: offlineFire(t, "ai") }, at: Date.now() };
      save(); render(); return;
    }
    busy = true; t.judge = { pending: true, at: Date.now() }; render(); busy = false;
    $("judgeBtn").disabled = true;
    const per = persona(t.persona);
    const log = t.posts.map(p => `${p.role === "ai" ? per.name : "ユーザー"}: ${p.text}`).join("\n");
    const prompt = `あなたは公平なディベート審判です。以下はSNS上のレスバ（口論）のスレッドです。論理性、具体性、反論の的確さ、ユーモアの観点で両者を採点してください。煽りの強さではなく中身で判定すること。\n\n${log}\n\nこれとは別に「火力」も採点してください。火力はインターネット的なノリでの言葉の強さです。ワードセンス、パンチラインのキレ、煽りの切れ味、ミーム力、ネットスラングの使いこなしを見ます（論理の正しさは関係なし）。差別や中傷で稼いだ火力は加点しないこと。punchline は各自の発言からいちばん火力の高い一文をそのまま抜き出すこと（改変禁止）。fire の comment はネット民のノリで、30字以内（例:「語彙が鋭利すぎて草」「火力はあるけど空振り気味」）。\n\n次のJSONだけを返してください: {"user": 0-100の整数, "ai": 0-100の整数, "winner": "user" | "ai" | "draw", "comment": "判定理由を日本語で80字以内、少しくだけた口調で", "fire": {"user": {"score": 0-100の整数, "punchline": "...", "comment": "..."}, "ai": {"score": 0-100の整数, "punchline": "...", "comment": "..."}}}`;
    try {
      const j = await sample.json(prompt, { cache: false });
      const clamp = (n) => Math.max(0, Math.min(100, Math.round(+n || 0)));
      const fx = (x) => ({ score: clamp(x && x.score), punchline: String((x && x.punchline) || "").slice(0, 200), comment: String((x && x.comment) || "").slice(0, 60) });
      t.judge = { user: clamp(j.user), ai: clamp(j.ai), winner: ["user", "ai", "draw"].includes(j.winner) ? j.winner : "draw", comment: String(j.comment || ""), fire: j.fire ? { user: fx(j.fire.user), ai: fx(j.fire.ai) } : null, at: Date.now() };
    } catch (e) {
      t.judge = null;
      toast(e && e.code === "rate_limited" ? "判定のリクエストが多すぎます。少し待ってから試してください" : "判定を取得できませんでした。もう一度押してください");
    }
    save(); render();
  }

  // ---------- actions ----------
  function newThread(text) {
    const t = { id: "t" + Date.now().toString(36), persona: selPersona, heat, createdAt: Date.now(), posts: [{ role: "user", text, at: Date.now(), likes: Math.floor(Math.random() * 60), rts: Math.floor(Math.random() * 8) }], judge: null };
    threads = threads.filter(x => !x.example || x.posts.length > 4);
    threads.unshift(t); currentId = t.id; save();
    aiReply();
  }

  $("composer").addEventListener("submit", (e) => {
    e.preventDefault();
    const v = $("replyInput").value.trim();
    if (!v || busy || len(v) > LIMIT) return;
    const t = cur();
    t.posts.push({ role: "user", text: v, at: Date.now(), likes: Math.floor(Math.random() * 120), rts: Math.floor(Math.random() * 10) });
    $("replyInput").value = ""; autosize();
    aiReply();
  });
  $("replyInput").addEventListener("keydown", (e) => {
    if (e.key === "Enter" && (e.metaKey || e.ctrlKey)) { e.preventDefault(); $("composer").requestSubmit(); }
  });
  const autosize = () => { const ta = $("replyInput"); ta.style.height = "auto"; ta.style.height = Math.min(180, ta.scrollHeight) + "px"; };
  $("replyInput").addEventListener("input", () => { autosize(); updateCount(); });
  $("stopBtn").onclick = () => ctl?.abort();

  const qbox = $("quick");
  QUICK.forEach(q => { const b = el("button", null, q); b.type = "button"; b.onclick = () => { const ta = $("replyInput"); ta.value = ta.value ? ta.value + " " + q : q; ta.focus(); autosize(); updateCount(); }; qbox.append(b); });

  // modal
  function openModal(seed) {
    $("modalOpp").textContent = `${persona(selPersona).name} ${persona(selPersona).handle} · LV.${heat}`;
    $("newInput").value = seed || "";
    $("modal").hidden = false; updateNew(); setTimeout(() => $("newInput").focus(), 30);
  }
  const closeModal = () => { $("modal").hidden = true; };
  function updateNew() {
    const v = $("newInput").value; const left = LIMIT - len(v);
    $("newCount").textContent = left; $("newCount").classList.toggle("over", left < 0);
    $("newSend").disabled = !v.trim() || left < 0 || busy;
  }
  $("newInput").addEventListener("input", updateNew);
  $("closeModal").onclick = closeModal;
  $("modal").addEventListener("click", (e) => { if (e.target === $("modal")) closeModal(); });
  document.addEventListener("keydown", (e) => { if (e.key === "Escape") { closeModal(); closeDrawer(); } });
  $("newForm").addEventListener("submit", (e) => { e.preventDefault(); const v = $("newInput").value.trim(); if (!v || busy || len(v) > LIMIT) return; closeModal(); newThread(v); });
  const seeds = $("seeds");
  ["きのこの山はたけのこの里より上", "飲み会は1次会で帰るべき", "猫より犬のほうが賢い"].forEach(s => { const b = el("button", "chip-btn", s); b.type = "button"; b.onclick = () => { $("newInput").value = s; updateNew(); }; seeds.append(b); });

  // heat
  $("heat").value = heat; $("heatLv").textContent = "LV." + heat;
  $("heat").addEventListener("input", (e) => { heat = +e.target.value; $("heatLv").textContent = "LV." + heat; store.set("resba.heat", heat); const t = cur(); if (!busy) { t.heat = heat; save(); render(); } });

  // drawer (phone)
  function openDrawer() {
    const d = $("drawer"); d.textContent = "";
    const side = el("aside", "side");
    const p1 = el("section", "panel"); p1.append(el("h2", null, "対戦相手")); const pl = el("div"); p1.append(pl);
    const hl = el("div", "heat"); hl.innerHTML = `<label for="heat2"><span>煽り度</span><span class="lv">LV.${heat}</span></label>`;
    const r = el("input"); r.type = "range"; r.id = "heat2"; r.min = 1; r.max = 5; r.value = heat;
    r.oninput = () => { heat = +r.value; hl.querySelector(".lv").textContent = "LV." + heat; $("heat").value = heat; $("heatLv").textContent = "LV." + heat; store.set("resba.heat", heat); if (!busy) { cur().heat = heat; save(); render(); } };
    hl.append(r); p1.append(hl);
    const p2 = el("section", "panel"); p2.append(el("h2", null, "いまのトレンド")); const tl = el("div"); p2.append(tl);
    const p3 = el("section", "panel"); p3.append(el("h2", null, "履歴")); const hi = el("div"); hi.style.padding = "0 4px 8px"; p3.append(hi);
    threads.forEach(t => { const b = el("button", "hist"); b.type = "button"; if (t.id === currentId) b.setAttribute("aria-current", "true"); b.append(el("span", null, (t.example ? "［見本］" : "") + t.posts[0].text), el("small", null, `vs ${persona(t.persona).handle} · ${t.posts.filter(p => p.role === "user").length}R`)); b.onclick = () => { if (busy) return; currentId = t.id; save(); render(); closeDrawer(); }; hi.append(b); });
    side.append(p1, p2, p3);
    d.append(side);
    renderPersonas(pl); renderTrends(tl);
    d.hidden = false;
  }
  function closeDrawer() { $("drawer").hidden = true; renderPersonas(); }
  $("drawer").addEventListener("click", (e) => { if (e.target === $("drawer")) closeDrawer(); });

  // theme toggle
  function toggleTheme() {
    const r = document.documentElement;
    const isDark = r.dataset.theme ? r.dataset.theme === "dark" : !matchMedia("(prefers-color-scheme: light)").matches;
    r.dataset.theme = isDark ? "light" : "dark";
    store.set("resba.theme", r.dataset.theme);
  }
  const savedTheme = store.get("resba.theme", null); if (savedTheme) document.documentElement.dataset.theme = savedTheme;

  $("navPost").onclick = () => openModal("");
  $("tabPost").onclick = () => openModal("");
  $("navJudge").onclick = runJudge; $("tabJudge").onclick = runJudge; $("judgeBtn").onclick = runJudge;
  $("navTheme").onclick = toggleTheme; $("tabTheme").onclick = toggleTheme;
  $("navHome").onclick = () => $("feed").scrollTo({ top: 0, behavior: "smooth" });
  $("tabOpp").onclick = openDrawer;

  // clock
  const tick = () => { $("clock").textContent = "TOKYO " + new Date().toLocaleTimeString("ja-JP", { timeZone: "Asia/Tokyo", hour: "2-digit", minute: "2-digit" }) + " · ONLINE"; };
  tick(); setInterval(tick, 15000);
  setInterval(() => { if (!busy) document.querySelectorAll(".post .time").length && render(); }, 60000);

  renderTrends(); render();

  // connect to Claude
  if (window.claude && window.claude.use) {
    window.claude.use("sample").then(s => { sample = s; sampleReady = !!s; window.__sampleChecked = true; render(); }).catch(() => { window.__sampleChecked = true; render(); });
  } else { window.__sampleChecked = true; render(); }
})();
</script>
